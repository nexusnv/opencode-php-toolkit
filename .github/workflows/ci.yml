name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 5 requires Node >= 22.12, so the full suite runs here.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ must be in sync with src/
        run: git diff --exit-code -- dist
      - name: plugin imports and exposes the right id
        run: |
          node -e "import('./dist/index.js').then(m => { if (m.default.id !== 'php-toolkit') throw new Error('unexpected plugin id') })"
      - name: npm pack smoke test
        run: npm pack --dry-run

  node-20-compat:
    name: Node 20 compat (published engines floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: dist/ must be in sync with src/
        run: git diff --exit-code -- dist
      # The published plugin runs on Node 20; the test suite does not.
      - name: plugin imports
        run: node -e "import('./dist/index.js').then(m => console.log('plugin id:', m.default.id))"
